[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batchgrids"
dynamic = ["version"]
description = "Tool management and organization application with computer vision"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["tools", "organization", "computer-vision", "gridfinity"]
authors = [
  { name = "BatchGrids Team" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "fastapi>=0.104.1",
  "uvicorn[standard]>=0.24.0",
  "sqlalchemy>=2.0.23",
  "alembic>=1.12.1",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "celery>=5.3.4",
  "redis>=5.0.1",
  "opencv-python>=4.8.1",
  "opencv-contrib-python>=4.8.1",
  "ultralytics>=8.0.206",
  "onnxruntime>=1.16.3",
  "numpy>=1.24.4",
  "pillow>=10.1.0",
  "apriltag>=0.0.16",
  "scikit-image>=0.22.0",
  "shapely>=2.0.2",
  "boto3>=1.34.0",
  "python-multipart>=0.0.6",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "svgwrite>=1.4.3",
  "reportlab>=4.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "black>=23.11.0",
  "ruff>=0.1.7",
  "mypy>=1.7.1",
  "pre-commit>=3.5.0",
]

[project.urls]
Documentation = "https://github.com/percosys/BatchGrids#readme"
Issues = "https://github.com/percosys/BatchGrids/issues"
Source = "https://github.com/percosys/BatchGrids"

[project.scripts]
batchgrids-test-vision = "batchgrids.cli.test_vision:main"
batchgrids-generate-mat = "batchgrids.cli.generate_calibration_mat:main"

[tool.hatch.version]
path = "src/batchgrids/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.11", "3.12"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:src/batchgrids tests}"
style = [
  "ruff {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.black]
target-version = ["py311"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "S101", # Use of assert
  "S104", # Hardcoded bind all interfaces
  "PLR0913", # Too many arguments
]

[tool.ruff.isort]
known-first-party = ["batchgrids"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["batchgrids", "tests"]
branch = true
parallel = true
omit = [
  "src/batchgrids/__about__.py",
]

[tool.coverage.paths]
batchgrids = ["src/batchgrids", "*/batchgrids/src/batchgrids"]
tests = ["tests", "*/batchgrids/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]